name: Publish

on:
  workflow_call:
    inputs:
      solution:
        description: Solution file, e.g. Wrap.slnx
        type: string
        required: true
      name:
        description: Project name used in Slack messages, e.g. Wrap
        type: string
        required: true
      dotnet-versions:
        description: .NET SDK versions to install, one per line
        type: string
        default: |
          8.0.x
          9.0.x
          10.0.x
      dry_run:
        description: Check NuGet login without publishing
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: true                     # Disable the .NET logo in the console output
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true # Disable the .NET first time experience to skip caching NuGet packages and speed up the build
  DOTNET_CLI_TELEMETRY_OPTOUT: true       # Disable sending .NET CLI telemetry to Microsoft
  PACKAGES_DIR: /home/runner/packages

jobs:
  restore-build-test-pack:
    runs-on: ubuntu-latest
    steps:
    -
      name: Prepare - Checkout Code
      uses: actions/checkout@v7
    -
      name: Prepare - Read Version
      uses: bfren/read-file@v2
      with:
        file: ./Version
      id: version
    -
      name: Prepare - Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-versions }}
    -
      name: Restore
      run: |
        dotnet restore "${{ inputs.solution }}"
    -
      name: Style
      run: |
        dotnet format style -v d "${{ inputs.solution }}" \
          --no-restore \
          --verify-no-changes
    -
      name: Build
      run: |
        dotnet build "${{ inputs.solution }}" \
          --no-restore \
          --configuration Release
    -
      if: success()
      name: Pack
      run: |
        dotnet pack Pack.csproj \
          --no-build \
          --configuration Release \
          /p:PackageOutputPath=${{ env.PACKAGES_DIR }} \
          -p:PackageVersion=${{ steps.version.outputs.contents }}
    -
      name: Store
      uses: actions/upload-artifact@v7
      with:
        name: nupkgs
        path: ${{ env.PACKAGES_DIR }}
  publish:
    runs-on: ubuntu-latest
    needs: restore-build-test-pack
    if: success()
    permissions:
      id-token: write   # lets NuGet/login exchange a GitHub token for a 1-hour NuGet key
      packages: write   # still needed for the GitHub Packages push
    steps:
    - name: Retrieve
      uses: actions/download-artifact@v8
      with:
        name: nupkgs
        path: ${{ env.PACKAGES_DIR }}
    -
      name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    -
      if: success() && !inputs.dry_run
      name: Push
      run: |
        dotnet nuget push "${{ env.PACKAGES_DIR }}/*.nupkg" \
          --skip-duplicate \
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json
        dotnet nuget push "${{ env.PACKAGES_DIR }}/*.nupkg" \
          --skip-duplicate \
          --api-key ${{ secrets.GITHUB_TOKEN }} \
          --source https://nuget.pkg.github.com/bfren/index.json
  notify:
    runs-on: ubuntu-latest
    needs: [restore-build-test-pack, publish]
    if: always() && !inputs.dry_run # always(): otherwise this job is skipped when an earlier job fails, and the failure message is never sent
    steps:
    -
      if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }} # step success() only sees steps in this job, so check the jobs it needs
      name: Success
      uses: bfren/action-slack-notify@master
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_USERNAME: ${{ inputs.name }} (GitHub)
        SLACK_MESSAGE: Publish Succeeded
        SLACK_COLOR: good
        SLACK_ICON: https://bfren.dev/img/logo-square-500x500.jpg
    -
      if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      name: Failure
      uses: bfren/action-slack-notify@master
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        SLACK_USERNAME: ${{ inputs.name }} (GitHub)
        SLACK_MESSAGE: Publish Failed
        SLACK_COLOR: danger
        SLACK_ICON: https://bfren.dev/img/logo-square-500x500.jpg
