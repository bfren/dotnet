name: Test

on:
  workflow_call:
    inputs:
      solution:
        description: Solution file, e.g. Wrap.slnx
        type: string
        required: true
      name:
        description: Project name used in Slack messages, e.g. Wrap
        type: string
        required: true
      configuration:
        description: Build configuration that includes the test projects
        type: string
        default: Debug
      dotnet-versions:
        description: .NET SDK versions to install, one per line
        type: string
        default: |
          8.0.x
          9.0.x
          10.0.x

env:
  DOTNET_NOLOGO: true                     # Disable the .NET logo in the console output
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true # Disable the .NET first time experience to skip caching NuGet packages and speed up the build
  DOTNET_CLI_TELEMETRY_OPTOUT: true       # Disable sending .NET CLI telemetry to Microsoft

jobs:
  restore-build-test:
    runs-on: ubuntu-latest
    steps:
    -
      name: Prepare - Checkout Code
      uses: actions/checkout@v7
    -
      name: Prepare - Read Version
      uses: bfren/read-file@v2
      with:
        file: ./Version
      id: version
    -
      name: Prepare - Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-versions }}
    -
      name: Restore
      run: |
        dotnet restore "${{ inputs.solution }}"
    -
      name: Style
      run: |
        dotnet format style -v d "${{ inputs.solution }}" \
          --no-restore \
          --verify-no-changes
    -
      name: Build
      run: |
        dotnet build "${{ inputs.solution }}" \
          --no-restore \
          --configuration ${{ inputs.configuration }}
    -
      name: Test
      run: |
        dotnet test \
          --solution "${{ inputs.solution }}" \
          --no-restore \
          --no-build \
          --configuration ${{ inputs.configuration }}
  notify:
    needs: restore-build-test
    if: always() # otherwise this job is skipped when tests fail, and the failure message is never sent
    uses: bfren/dotnet/.github/workflows/notify.yml@main
    with:
      name: ${{ inputs.name }}
      results: ${{ toJSON(needs.*.result) }}
      success-message: Tests Passed
      failure-message: Test Failed
    secrets: inherit
